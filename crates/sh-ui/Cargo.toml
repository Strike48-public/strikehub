[package]
name = "sh-ui"
version.workspace = true
edition.workspace = true
default-run = "strikehub"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "sentry"]
server = ["dep:dioxus-liveview", "dep:axum", "sentry"]
sentry = ["dep:sentry", "dep:sentry-tracing", "sh-core/sentry"]

[lib]
name = "sh_ui"
path = "src/lib.rs"

[[bin]]
name = "strikehub"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "strikehub-server"
path = "src/bin/strikehub-server.rs"
required-features = ["server"]

[dependencies]
sh-core = { path = "../sh-core" }
anyhow.workspace = true
dioxus.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
open.workspace = true
dirs.workspace = true
futures-util = "0.3.32"

# Server/liveview dependencies
dioxus-liveview = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

# Sentry observability (optional)
sentry = { workspace = true, optional = true }
sentry-tracing = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# PLG #376 inspector (STRIKEHUB_INSPECTOR=1): locate the app’s WKWebView and
# drive its public API (takeSnapshot, evaluateJavaScript) from a unix socket.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
block2 = "0.6"
dispatch = "0.2"
base64 = "0.22"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
