[package]
name = "sh-core"
version.workspace = true
edition.workspace = true

[build-dependencies]
toml = "0.8"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
dirs.workspace = true
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
reqwest.workspace = true
regex.workspace = true
tracing.workspace = true
tokio-tungstenite.workspace = true
native-tls.workspace = true
futures.workspace = true
urlencoding.workspace = true
open.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true

# HTTP primitives for Unix socket IPC
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true

# Archive extraction (connector binary fetch)
flate2.workspace = true
tar.workspace = true
zip.workspace = true

# Sentry observability (optional)
sentry = { workspace = true, optional = true }
sentry-anyhow = { workspace = true, optional = true }

[features]
sentry = ["dep:sentry", "dep:sentry-anyhow"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Object teardown for issue #115 (JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE).
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
