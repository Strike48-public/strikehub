name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no publish)'
        required: true
        default: true
        type: boolean
      # TEMPORARY: macOS signing disabled by default during Apple developer account suspension.
      # TODO: Change default back to true once account is restored.
      macos_signing:
        description: 'Enable macOS code signing & notarization (default: false due to account suspension)'
        required: true
        default: false
        type: boolean

# Only run in the origin repo, never on forks
run-name: "Release ${{ github.ref_name }} (org-only)"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Ship the bundled pentest-agent easy-mode-first. Read at BUILD time via
  # option_env! in pick's config.rs, so it must be present when the connector
  # compiles (applies to every job/step). NOTE: strikehub's own easy-mode default
  # is NOT set here — build.rs bakes it from build-defaults.toml ([easy_mode]
  # default), which overrides any ambient env, so a var here would be dead.
  PICK_EASY_MODE: "true"

# Versioning: Cargo.toml is bumped in the same PR that ships the change.
# Each job below re-stamps Cargo.toml from the tag at build time, so
# shipped artifacts always carry the tag's version regardless of what
# main currently reads.
jobs:
  docker:
    name: Docker Image
    if: github.repository_owner == 'Strike48-public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Cargo.toml to tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TARGET="${GITHUB_REF_NAME#v}"
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CURRENT" != "$TARGET" ]; then
            sed -i.bak "s/^version = \".*\"/version = \"$TARGET\"/" Cargo.toml
            rm Cargo.toml.bak
            echo "Bumped Cargo.toml: $CURRENT -> $TARGET"
          else
            echo "Cargo.toml already at $TARGET"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: Build ${{ matrix.target }}
    if: github.repository_owner == 'Strike48-public'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: strikehub-darwin-x86_64
            binary_name: strikehub
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: strikehub-darwin-aarch64
            binary_name: strikehub

    steps:
      - uses: actions/checkout@v4

      - name: Sync Cargo.toml to tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TARGET="${GITHUB_REF_NAME#v}"
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CURRENT" != "$TARGET" ]; then
            sed -i.bak "s/^version = \".*\"/version = \"$TARGET\"/" Cargo.toml
            rm Cargo.toml.bak
            echo "Bumped Cargo.toml: $CURRENT -> $TARGET"
          else
            echo "Cargo.toml already at $TARGET"
          fi

      - name: Load connector refs
        run: cat connector-versions.env >> "$GITHUB_ENV"

      - name: Resolve bundled connector timestamps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bake each pinned connector's git commit timestamp (ISO-8601 UTC) into
          # the strikehub binary so the runtime "newest wins" resolver knows what
          # this install shipped. Uses the GitHub API (no full clone needed here;
          # the connectors are cloned+built in later steps).
          # Resolve a ref's commit date (ISO-8601 …Z). Best-effort: a failed
          # lookup prints nothing and returns 0, so the step never aborts under
          # `set -e -o pipefail` (a missing ts just bakes epoch-0 → that connector
          # won't seed, which is safe). Try the branches endpoint FIRST because it
          # handles slash-containing branch names (e.g. josh/catching-up) that the
          # commits/<ref> path misinterprets; fall back to commits/ for tags/SHAs.
          resolve_ts () {
            local repo="$1" ref="$2" ts=""
            # Branch first (handles slashed branch names), then tag/SHA via commits.
            # A 404 body is non-empty, so a naive `-z` check would skip the fallback
            # and bake the error JSON as the timestamp. Gate on the ISO-8601 date
            # shape: fall through to commits/ if branches/ didn't return a date, and
            # empty out anything that still isn't a date (-> epoch-0, seed no-ops).
            ts="$(gh api "repos/$repo/branches/$ref" --jq '.commit.commit.committer.date' 2>/dev/null)" || ts=""
            case "$ts" in ????-??-??T??:??:??Z) ;; *)
              ts="$(gh api "repos/$repo/commits/$ref" --jq '.commit.committer.date' 2>/dev/null)" || ts="" ;;
            esac
            case "$ts" in ????-??-??T??:??:??Z) ;; *) ts="" ;; esac
            printf '%s' "$ts"
          }
          PICK_TS="$(resolve_ts Strike48-public/pick "$PICK_REF")"
          KS_TS="$(resolve_ts Strike48-public/kubestudio "$KUBESTUDIO_REF")"
          echo "STRIKEHUB_BUNDLED_PICK_REF=$PICK_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_PICK_TS=$PICK_TS" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_REF=$KUBESTUDIO_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_TS=$KS_TS" >> "$GITHUB_ENV"
          echo "Bundled: pick=$PICK_REF@$PICK_TS  kubestudio=$KUBESTUDIO_REF@$KS_TS"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install protobuf
        run: brew install protobuf

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features desktop

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.binary_name }}

      # Build connectors from source at pinned git refs
      - name: Checkout and build pentest-agent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/pick.git /tmp/pick
          git -C /tmp/pick checkout ${{ env.PICK_REF }}
          cargo build --release --manifest-path /tmp/pick/Cargo.toml --bin pentest-agent --target ${{ matrix.target }}
          cp /tmp/pick/target/${{ matrix.target }}/release/pentest-agent dist/

      - name: Checkout and build ks-connector
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/kubestudio.git /tmp/kubestudio
          git -C /tmp/kubestudio checkout ${{ env.KUBESTUDIO_REF }}
          cargo build --release --manifest-path /tmp/kubestudio/Cargo.toml --bin ks-connector --features connector --target ${{ matrix.target }}
          cp /tmp/kubestudio/target/${{ matrix.target }}/release/ks-connector dist/

      - name: Import Apple certificate
        if: inputs.macos_signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Sign macOS binaries
        if: inputs.macos_signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for bin in dist/*; do
            codesign --force --options runtime \
              --entitlements entitlements.plist \
              --sign "Developer ID Application: Devo Inc. ($APPLE_TEAM_ID)" \
              "$bin"
          done

      - name: Notarize strikehub binary
        if: inputs.macos_signing
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only notarize strikehub — connectors are notarized by their own repos
          ditto -c -k --keepParent dist/${{ matrix.binary_name }} $RUNNER_TEMP/strikehub.zip

          SUBMIT_OUT=$(xcrun notarytool submit $RUNNER_TEMP/strikehub.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json)
          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Submission ID: $SUBMISSION_ID"

          for attempt in 1 2 3; do
            echo "Waiting for notarization (attempt $attempt/3, 30m timeout)..."
            if xcrun notarytool wait "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --timeout 30m; then

              STATUS=$(xcrun notarytool info "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --output-format json | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")

              if [ "$STATUS" = "Accepted" ]; then
                echo "Notarization succeeded."
                break
              else
                echo "Notarization finished with status: $STATUS"
                xcrun notarytool log "$SUBMISSION_ID" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
                exit 1
              fi
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Notarization still in progress after 3 wait cycles (90m total)."
              exit 1
            fi
            echo "Timeout reached, continuing to wait..."
          done

      - name: Package archive
        shell: bash
        working-directory: dist
        run: |
          tar -czvf ${{ matrix.artifact }}.tar.gz *
          # Keep only the archive for upload
          find . -maxdepth 1 ! -name '*.tar.gz' ! -name '*.sha256' -type f -delete

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: shasum -a 256 * > ${{ matrix.artifact }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  installers:
    name: Build ${{ matrix.name }}
    if: github.repository_owner == 'Strike48-public'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run on 24.04 (noble) to keep the glibc floor at 2.39
          # (glibc is not bundled; 22.04 support was dropped). Checked by the
          # "Verify glibc/libstdc++ floor" step.
          - os: ubuntu-24.04
            name: AppImage x86_64
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            artifact: strikehub-appimage-x86_64
            installer: appimage
            binary_name: strikehub
          - os: ubuntu-24.04-arm
            name: AppImage aarch64
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            artifact: strikehub-appimage-aarch64
            installer: appimage
            binary_name: strikehub
          - os: windows-latest
            name: MSI x86_64
            target: x86_64-pc-windows-msvc
            arch: x86_64
            artifact: strikehub-windows-x86_64
            installer: msi
            binary_name: strikehub.exe
          # Native ARM Windows runner (GA since 2025): builds strikehub.exe +
          # the connectors from source at the pinned refs for arm64, and WiX
          # links an arm64 MSI (build-msi.ps1 maps aarch64 -> arm64; the ARM
          # image ships no WiX, so a job step installs it first). The MSI
          # shares the x64 UpgradeCode, so on an ARM box it upgrades over an
          # existing x64 install instead of coexisting with it.
          - os: windows-11-arm
            name: MSI arm64
            target: aarch64-pc-windows-msvc
            arch: aarch64
            artifact: strikehub-windows-arm64
            installer: msi
            binary_name: strikehub.exe

    steps:
      - uses: actions/checkout@v4

      - name: Sync Cargo.toml to tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TARGET="${GITHUB_REF_NAME#v}"
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CURRENT" != "$TARGET" ]; then
            sed -i.bak "s/^version = \".*\"/version = \"$TARGET\"/" Cargo.toml
            rm Cargo.toml.bak
            echo "Bumped Cargo.toml: $CURRENT -> $TARGET"
          else
            echo "Cargo.toml already at $TARGET"
          fi

      - name: Load connector refs
        shell: bash
        run: cat connector-versions.env >> "$GITHUB_ENV"

      - name: Resolve bundled connector timestamps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bake each pinned connector's git commit timestamp (ISO-8601 UTC) into
          # the strikehub binary so the runtime "newest wins" resolver knows what
          # this install shipped. Uses the GitHub API (no full clone needed here;
          # the connectors are cloned+built in later steps).
          # Resolve a ref's commit date (ISO-8601 …Z). Best-effort: a failed
          # lookup prints nothing and returns 0, so the step never aborts under
          # `set -e -o pipefail` (a missing ts just bakes epoch-0 → that connector
          # won't seed, which is safe). Try the branches endpoint FIRST because it
          # handles slash-containing branch names (e.g. josh/catching-up) that the
          # commits/<ref> path misinterprets; fall back to commits/ for tags/SHAs.
          resolve_ts () {
            local repo="$1" ref="$2" ts=""
            # Branch first (handles slashed branch names), then tag/SHA via commits.
            # A 404 body is non-empty, so a naive `-z` check would skip the fallback
            # and bake the error JSON as the timestamp. Gate on the ISO-8601 date
            # shape: fall through to commits/ if branches/ didn't return a date, and
            # empty out anything that still isn't a date (-> epoch-0, seed no-ops).
            ts="$(gh api "repos/$repo/branches/$ref" --jq '.commit.commit.committer.date' 2>/dev/null)" || ts=""
            case "$ts" in ????-??-??T??:??:??Z) ;; *)
              ts="$(gh api "repos/$repo/commits/$ref" --jq '.commit.committer.date' 2>/dev/null)" || ts="" ;;
            esac
            case "$ts" in ????-??-??T??:??:??Z) ;; *) ts="" ;; esac
            printf '%s' "$ts"
          }
          PICK_TS="$(resolve_ts Strike48-public/pick "$PICK_REF")"
          KS_TS="$(resolve_ts Strike48-public/kubestudio "$KUBESTUDIO_REF")"
          echo "STRIKEHUB_BUNDLED_PICK_REF=$PICK_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_PICK_TS=$PICK_TS" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_REF=$KUBESTUDIO_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_TS=$KS_TS" >> "$GITHUB_ENV"
          echo "Bundled: pick=$PICK_REF@$PICK_TS  kubestudio=$KUBESTUDIO_REF@$KS_TS"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # NOTE: libwebkit2gtk-4.1-dev is deliberately NOT installed here —
          # the "Pin WebKitGTK 2.44.0-2" step below must be the first to
          # install it (apt refuses to downgrade 2.52.6 -> 2.44.0-2 without
          # --allow-downgrades).
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libpcap-dev \
            file \
            wget \
            imagemagick \
            librsvg2-bin \
            libfuse2t64

      # Pin WebKitGTK to 2.44.0-2 from the LIVE noble base pocket (main/
      # universe) — no snapshot.ubuntu.com dependency. WebKit >= 2.46 makes
      # EGL mandatory in the web process and has no CPU fallback — on
      # GPU-less hosts (Xvfb, containers, servers) the window stays black.
      # 2.44 is the last pre-mandatory-EGL release: the non-compositing
      # shared-memory path still works (the AppRun hook defaults
      # WEBKIT_DISABLE_COMPOSITING_MODE=1), so the app renders with no GL
      # stack at all. The noble-updates candidate is 2.52.6, so pin ALL SIX
      # packages together (pinning only -dev breaks apt's dependency
      # resolution); noble has no libwpe binary packages (webkit 2.44
      # dropped that dep) and libfuse2 is libfuse2t64 there. The arm64 noble
      # pockets ship the same 2.44.0-2 set. This step is the FIRST installer
      # of libwebkit2gtk-4.1-* on the runner (see the deps step note above).
      - name: Pin WebKitGTK 2.44.0-2 (GPU-less render fix)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0=2.44.0-2 libwebkit2gtk-4.1-dev=2.44.0-2 gir1.2-webkit2-4.1=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 libjavascriptcoregtk-4.1-dev=2.44.0-2 gir1.2-javascriptcoregtk-4.1=2.44.0-2
          pkg-config --modversion webkit2gtk-4.1 | grep -qx 2.44.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.installer }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features desktop

      - name: Prepare dist directory
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.binary_name }}

      # Build connectors from source at pinned git refs
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Checkout and build pentest-agent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/pick.git /tmp/pick
          git -C /tmp/pick checkout ${{ env.PICK_REF }}
          cargo build --release --manifest-path /tmp/pick/Cargo.toml --bin pentest-agent --target ${{ matrix.target }}
          cp /tmp/pick/target/${{ matrix.target }}/release/pentest-agent${{ runner.os == 'Windows' && '.exe' || '' }} dist/

      - name: Checkout and build ks-connector
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/kubestudio.git /tmp/kubestudio
          git -C /tmp/kubestudio checkout ${{ env.KUBESTUDIO_REF }}
          cargo build --release --manifest-path /tmp/kubestudio/Cargo.toml --bin ks-connector --features connector --target ${{ matrix.target }}
          cp /tmp/kubestudio/target/${{ matrix.target }}/release/ks-connector${{ runner.os == 'Windows' && '.exe' || '' }} dist/

      # ── AppImage steps ──
      - name: Build AppImage
        if: matrix.installer == 'appimage'
        run: |
          chmod +x scripts/build-appimage.sh
          TAG_VERSION="${{ github.ref_name }}"
          VERSION="${TAG_VERSION#v}"
          # ref_name may be a branch on workflow_dispatch (e.g. feat/easy-mode);
          # a '/' in the version breaks the output filename (mksquashfs can't
          # create a path with a missing dir). Sanitize to a flat token.
          VERSION="${VERSION//\//-}"
          ./scripts/build-appimage.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify AppImage bundles GTK/WebKit runtime
        if: matrix.installer == 'appimage'
        run: |
          set -euo pipefail
          AI=$(ls StrikeHub-*.AppImage | head -1)
          chmod +x "$AI"
          # Assert the runtime is bundled — if these libs aren't inside, the
          # AppImage relies on the host and isn't portable (the bug we fixed).
          # The wayland/gbm/EGL load-time deps had to be added explicitly:
          # stock Ubuntu (incl. minimal/server images) ships none of them, and
          # the build runners DO, which is why it was missing for years
          # without CI complaining. NOTE: no GL/mesa/DRI libs are checked
          # (and not expected) — the GL stack is intentionally NOT bundled;
          # rendering uses the non-compositing software path.
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./"$AI" --appimage-extract >/dev/null
          MISSING=0
          for lib in libwebkit2gtk-4.1.so.0 libgtk-3.so.0 libxdo.so.3 \
              libwayland-client libwayland-egl libgbm libEGL; do
            find squashfs-root -name "$lib*" | grep -q . || { echo "MISSING bundled lib: $lib"; MISSING=1; }
          done
          find squashfs-root -name 'WebKitNetworkProcess' | grep -q . || { echo "MISSING WebKitNetworkProcess helper"; MISSING=1; }
          # The hardcoded absolute WebKit exec path must be patched out, else the
          # web process can't spawn on a host without webkit at that fixed path.
          LIBWK=$(find squashfs-root -name 'libwebkit2gtk-4.1.so.0' -type f | head -1)
          python3 -c "import re,sys; d=open('$LIBWK','rb').read(); sys.exit(1 if re.search(rb'/usr/lib/[a-z0-9_]+-linux-gnu/webkit2gtk-4\.1\x00', d) else 0)" \
            && echo "webkit exec path patched to relative ✓" \
            || { echo "MISSING: libwebkit still has an absolute webkit2gtk-4.1 exec path (patch failed)"; MISSING=1; }
          for c in pentest-agent ks-connector; do
            find squashfs-root/usr/bin -maxdepth 1 -name "$c" | grep -q . || { echo "MISSING connector sibling: usr/bin/$c"; MISSING=1; }
          done
          rm -rf squashfs-root
          [ "$MISSING" -eq 0 ] || { echo "AppImage is NOT portable — runtime not bundled."; exit 1; }
          echo "AppImage bundles the GTK/WebKit runtime + keeps connector siblings ✓"

      - name: Verify AppImage runtime is static FUSE-3 (no libfuse.so.2)
        if: matrix.installer == 'appimage'
        run: |
          set -euo pipefail
          # The AppImage's embedded runtime decides which FUSE the artifact
          # needs. The legacy AppImageKit runtime dlopens libfuse.so.2 —
          # absent on stock Ubuntu 24.04+ (FUSE 3 only) — and dies at launch
          # silently from the app grid (Strike48/project-management#377
          # finding 2, BLOCKER; #382). Guard the runtime section, not just
          # the payload, on every build.
          scripts/check-appimage-fuse.sh "$(ls StrikeHub-*.AppImage | head -1)"

      - name: Verify glibc/libstdc++ floor
        if: matrix.installer == 'appimage'
        run: |
          set -euo pipefail
          AI=$(ls StrikeHub-*.AppImage | head -1)
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./"$AI" --appimage-extract >/dev/null
          scripts/check-glibc-floor.sh squashfs-root 2.39 3.4.32
          rm -rf squashfs-root

      - name: Generate checksum (AppImage)
        if: matrix.installer == 'appimage'
        run: sha256sum StrikeHub-*.AppImage > ${{ matrix.artifact }}.AppImage.sha256

      - uses: actions/upload-artifact@v4
        if: matrix.installer == 'appimage'
        with:
          name: ${{ matrix.artifact }}
          path: |
            StrikeHub-*.AppImage
            *.AppImage.sha256

      # ── MSI steps ──
      - name: Sign Windows binaries
        if: matrix.installer == 'msi'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The windows-11-arm image does not bundle the WiX Toolset (the x64
      # image ships v3.14 preinstalled). The choco package runs the official
      # MSI, which installs to Program Files but does NOT add the bin dir to
      # the runner PATH - locate it and export it via GITHUB_ENV so later
      # steps (and build-msi.ps1's PATH fallback) find candle/light.
      # The windows-11-arm image ships no WiX (the x64 image preinstalls 3.14).
      # Install from the official wixtoolset binary zip (single HTTPS download,
      # pinned release) instead of choco: the choco route sat 20+ minutes on a
      # windows-11-arm runner (source checks under throttling) and had never
      # completed on this image class before.
      - name: Install WiX Toolset v3 (windows-11-arm)
        if: runner.os == 'Windows' && runner.arch == 'ARM64' && matrix.installer == 'msi'
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host "WiX already on PATH"
            exit 0
          }
          $z = Join-Path $env:TEMP "wix314-binaries.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $z
          $ex = Join-Path $env:TEMP "wix314"
          Expand-Archive -Path $z -DestinationPath $ex -Force
          $candle = Get-ChildItem $ex -Recurse -Filter candle.exe | Select-Object -First 1
          if (-not $candle -or -not (Test-Path (Join-Path $candle.Directory.FullName "light.exe"))) {
            throw "candle.exe/light.exe not found in the WiX binaries zip"
          }
          $wixBin = $candle.Directory.FullName
          "PATH=$wixBin;$env:Path" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Host "WiX Toolset v3.14.1 at $wixBin"

      # The arm64 VC++ redist (vcruntime140.dll + vcruntime140_1.dll) must come
      # from Microsoft AND be read from a trustworthy process. This image has
      # proven, run by run:
      #   * VS 18's tree dir named "arm64\Microsoft.VC142.CRT" contains X64 DLLs
      #     (machine 0x8664) - directory names are not ground truth here.
      #   * The x64-hosted pwsh process sees a FUSION-REDIRECTED System32:
      #     vcruntime140.dll reads 0xAA64 (arm64, the only copy) while
      #     vcruntime140_1.dll in the SAME dir reads 0x8664 (an x64 shadow copy
      #     exists because the x64 redist is also installed).
      #   * aka.ms vc_redist.arm64.exe is an x86 DOWNLOADER bundle: /layout
      #     yields only the exe (no embedded payload MSI), but /install runs.
      # Solution: every PE read of a CRT file happens in an ARM64-NATIVE
      # process (the image's toolcache Python, PE-verified 0xAA64 at
      # runtime), which sees the true native System32. Probe order: VS tree
      # (any 15/16/17/18) -> stage from the native System32 view -> install
      # the MS bundle and re-stage. Verified dirs are exported as
      # SHVCREDIST_DIR (build-msi.ps1's root #1, before its System32 root).
      - name: Ensure arm64 VC++ CRT redist (windows-11-arm)
        if: runner.os == 'Windows' && runner.arch == 'ARM64' && matrix.installer == 'msi'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-PeMachine {
            param([string]$Path)
            $fs = [IO.File]::OpenRead($Path)
            try {
              $head = New-Object byte[] 4096
              [void]$fs.Read($head, 0, 4096)
              if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) { return -1 }
              $peOff = [BitConverter]::ToInt32($head, 0x3C)
              if ($head[$peOff] -ne 0x50 -or $head[$peOff + 1] -ne 0x45) { return -1 }
              return [int][BitConverter]::ToUInt16($head, $peOff + 4)
            } finally { $fs.Close() }
          }
          function Invoke-Native {
            param([string]$Bin, [string[]]$Argv)
            $prev = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $out = & $Bin @Argv 2>&1
            $code = $LASTEXITCODE
            $ErrorActionPreference = $prev
            return @{ Code = $code; Out = ($out | ForEach-Object { "$_" }) }
          }
          # An ARM64-native interpreter: the only process class that sees the
          # true (non-fusion-redirected) System32 on this machine.
          $armPy = Get-ChildItem "C:\hostedtoolcache\windows\Python" -Directory -ErrorAction SilentlyContinue |
                   Sort-Object Name -Descending |
                   ForEach-Object { Join-Path $_.FullName "arm64\python.exe" } |
                   Where-Object { Test-Path $_ } |
                   Select-Object -First 1
          if (-not $armPy -or (Get-PeMachine $armPy) -ne 0xAA64) {
            throw "no arm64-native python in C:\hostedtoolcache\windows\Python (found: $armPy) - cannot read the native System32 view"
          }
          Write-Host "arm64-native interpreter: $armPy"
          # Python helpers (run arm64-native). check <dir>: report the machine
          # of <dir>\vcruntime140_1.dll. stage <stagedir>: verify BOTH redist
          # DLLs are 0xAA64 in the native System32 view, copy them into
          # <stagedir>, re-verify the copies.
          $pyHelper = @'
import shutil, struct, sys
def machine(p):
    with open(p, "rb") as f:
        h = f.read(4096)
    if len(h) < 4096 or h[:2] != b"MZ":
        print("NOMZ " + p); sys.exit(1)
    off = struct.unpack_from("<I", h, 0x3C)[0]
    if h[off:off + 2] != b"PE":
        print("NOPE " + p); sys.exit(1)
    return struct.unpack_from("<H", h, off + 4)[0]
mode, arg = sys.argv[1], sys.argv[2]
if mode == "check":
    m = machine(arg + "\\vcruntime140_1.dll")
    print("MACHINE 0x%X" % m)
    sys.exit(0 if m == 0xAA64 else 1)
if mode == "stage":
    for n in ("vcruntime140.dll", "vcruntime140_1.dll"):
        src = "C:\\Windows\\System32\\" + n
        m = machine(src)
        if m != 0xAA64:
            print("NATIVE_VIEW_FAIL %s 0x%X" % (n, m)); sys.exit(1)
        dst = arg + "\\" + n
        shutil.copyfile(src, dst)
        m2 = machine(dst)
        if m2 != 0xAA64:
            print("COPY_CHECK_FAIL %s 0x%X" % (n, m2)); sys.exit(1)
        print("STAGED %s 0xAA64" % n)
    print("NATIVE_VIEW_OK")
    sys.exit(0)
'@
          $stage = Join-Path $env:TEMP "crt-stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          # 1) VS tree, any version (15/16/17/18), both PF roots - PE-verified
          #    by the arm64-native process (dir names lie on this image).
          $vsCrt = Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\arm64\Microsoft.VC14*.CRT",
                                 "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\arm64\Microsoft.VC14*.CRT" -ErrorAction SilentlyContinue |
                   Where-Object { Test-Path (Join-Path $_.FullName "vcruntime140_1.dll") } |
                   Select-Object -First 1
          if ($vsCrt) {
            $r = Invoke-Native -Bin $armPy -Argv @("check", $vsCrt.FullName)
            Write-Host ("VS tree dir " + $vsCrt.FullName + " -> " + (($r.Out | ForEach-Object { "$_" }) -join ' '))
            if ($r.Code -eq 0) {
              Add-Content -Path $env:GITHUB_ENV "SHVCREDIST_DIR=$($vsCrt.FullName)"
              Write-Host "arm64 CRT redist in VS tree (verified 0xAA64): $($vsCrt.FullName)"
              exit 0
            }
          }
          Write-Host "no usable arm64 CRT in the VS tree - staging from the native System32 view" -ForegroundColor Yellow
          # 2) stage both DLLs from the native System32 view (arm64 python)
          $r = Invoke-Native -Bin $armPy -Argv @("stage", $stage)
          Write-Host (($r.Out | ForEach-Object { "$_" }) -join "`n")
          if ($r.Code -eq 0) {
            Add-Content -Path $env:GITHUB_ENV "SHVCREDIST_DIR=$stage"
            Write-Host "arm64 CRT staged from native System32: $stage"
            exit 0
          }
          # 3) the ARM64 redist is not fully installed: install the official MS
          #    bundle (x86 launcher - Start-Process, it does run on this image)
          #    and re-stage.
          Write-Host "installing the official VC++ ARM64 redist bundle (aka.ms) and re-staging" -ForegroundColor Yellow
          $dl = Join-Path $env:TEMP "vc_redist.arm64"
          New-Item -ItemType Directory -Path $dl -Force | Out-Null
          $exe = Join-Path $dl "vc_redist.arm64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.arm64.exe" -OutFile $exe
          $exeInfo = Get-Item $exe
          Write-Host ("vc_redist.arm64.exe: " + $exeInfo.Length + " bytes, product " + $exeInfo.VersionInfo.ProductVersion + ", PE machine 0x" + ("{0:X4}" -f (Get-PeMachine $exe)))
          $launchErr = $null
          $proc = $null
          $prev = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try { $proc = Start-Process -FilePath $exe -ArgumentList @("/install", "/quiet", "/norestart") -Wait -PassThru }
          catch { $launchErr = "$_" }
          $ErrorActionPreference = $prev
          if ($launchErr -or $null -eq $proc) { throw "redist bundle could not start: $launchErr" }
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { throw "redist bundle /install failed (exit $($proc.ExitCode))" }
          $r = Invoke-Native -Bin $armPy -Argv @("stage", $stage)
          Write-Host (($r.Out | ForEach-Object { "$_" }) -join "`n")
          if ($r.Code -ne 0) { throw "arm64 CRT still missing from the native System32 view after bundle install" }
          Add-Content -Path $env:GITHUB_ENV "SHVCREDIST_DIR=$stage"
          Write-Host "arm64 CRT staged after bundle install: $stage"

      - name: Build Windows MSI
        if: matrix.installer == 'msi'
        shell: pwsh
        run: |
          # WiX Product/@Version must be numeric x.x.x.x, so it can't be a branch
          # name (workflow_dispatch sets ref_name to e.g. feat/easy-mode). Always
          # build the MSI with the numeric Cargo.toml version; the artifact is
          # renamed to the static name below regardless, so the branch label isn't
          # needed in the filename.
          $Version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          Write-Host "MSI ProductVersion: $Version"
          .\scripts\build-msi.ps1 -Version $Version -Arch ${{ matrix.arch }}
          Move-Item "StrikeHub-$Version-${{ matrix.arch }}.msi" "dist\${{ matrix.artifact }}.msi"

      # Guard against regressing the clean-Windows CRT failure (v0.1.22 field
      # bug: "VCRUNTIME140_1.dll was not found"): every DLL the shipped exes
      # import must be OS-provided or staged in redist\ by build-msi.ps1.
      - name: Verify app-local CRT coverage
        if: matrix.installer == 'msi'
        shell: pwsh
        run: .\scripts\verify-crt-coverage.ps1

      - name: Sign MSI
        if: matrix.installer == 'msi'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Clean dist for MSI
        if: matrix.installer == 'msi'
        shell: bash
        working-directory: dist
        run: find . -maxdepth 1 ! -name '*.msi' ! -name '*.sha256' -type f -delete

      - name: Generate checksum (MSI)
        if: matrix.installer == 'msi'
        shell: bash
        working-directory: dist
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum * > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 * > ${{ matrix.artifact }}.sha256
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.installer == 'msi'
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  dmg:
    name: Build DMG (${{ matrix.arch }})
    if: github.repository_owner == 'Strike48-public'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
            connector_suffix: darwin-x86_64
          # macos-26: the current GA ARM Mac image (macos-latest since 2026-06).
          # The previous label, macos-15, had its ARM pool config retired by
          # GitHub ("configuration 'macos-14-arm64-us-default' is not supported")
          # and cancelled the Mac ARM DMG on the 2026-11-07 main build.
          # macOS 26 is arm64-only, so the Intel build stays on macos-15-intel.
          - os: macos-26
            arch: aarch64
            target: aarch64-apple-darwin
            connector_suffix: darwin-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Sync Cargo.toml to tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TARGET="${GITHUB_REF_NAME#v}"
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CURRENT" != "$TARGET" ]; then
            sed -i.bak "s/^version = \".*\"/version = \"$TARGET\"/" Cargo.toml
            rm Cargo.toml.bak
            echo "Bumped Cargo.toml: $CURRENT -> $TARGET"
          else
            echo "Cargo.toml already at $TARGET"
          fi

      - name: Load connector refs
        run: cat connector-versions.env >> "$GITHUB_ENV"

      - name: Resolve bundled connector timestamps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bake each pinned connector's git commit timestamp (ISO-8601 UTC) into
          # the strikehub binary so the runtime "newest wins" resolver knows what
          # this install shipped. Uses the GitHub API (no full clone needed here;
          # the connectors are cloned+built in later steps).
          # Resolve a ref's commit date (ISO-8601 …Z). Best-effort: a failed
          # lookup prints nothing and returns 0, so the step never aborts under
          # `set -e -o pipefail` (a missing ts just bakes epoch-0 → that connector
          # won't seed, which is safe). Try the branches endpoint FIRST because it
          # handles slash-containing branch names (e.g. josh/catching-up) that the
          # commits/<ref> path misinterprets; fall back to commits/ for tags/SHAs.
          resolve_ts () {
            local repo="$1" ref="$2" ts=""
            # Branch first (handles slashed branch names), then tag/SHA via commits.
            # A 404 body is non-empty, so a naive `-z` check would skip the fallback
            # and bake the error JSON as the timestamp. Gate on the ISO-8601 date
            # shape: fall through to commits/ if branches/ didn't return a date, and
            # empty out anything that still isn't a date (-> epoch-0, seed no-ops).
            ts="$(gh api "repos/$repo/branches/$ref" --jq '.commit.commit.committer.date' 2>/dev/null)" || ts=""
            case "$ts" in ????-??-??T??:??:??Z) ;; *)
              ts="$(gh api "repos/$repo/commits/$ref" --jq '.commit.committer.date' 2>/dev/null)" || ts="" ;;
            esac
            case "$ts" in ????-??-??T??:??:??Z) ;; *) ts="" ;; esac
            printf '%s' "$ts"
          }
          PICK_TS="$(resolve_ts Strike48-public/pick "$PICK_REF")"
          KS_TS="$(resolve_ts Strike48-public/kubestudio "$KUBESTUDIO_REF")"
          echo "STRIKEHUB_BUNDLED_PICK_REF=$PICK_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_PICK_TS=$PICK_TS" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_REF=$KUBESTUDIO_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_TS=$KS_TS" >> "$GITHUB_ENV"
          echo "Bundled: pick=$PICK_REF@$PICK_TS  kubestudio=$KUBESTUDIO_REF@$KS_TS"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-dmg

      - name: Install rsvg-convert and protobuf
        run: brew install librsvg protobuf

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features desktop

      - name: Prepare dist directory
        run: mkdir -p dist

      # Build connectors from source at pinned git refs
      - name: Checkout and build pentest-agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/pick.git /tmp/pick
          git -C /tmp/pick checkout ${{ env.PICK_REF }}
          cargo build --release --manifest-path /tmp/pick/Cargo.toml --bin pentest-agent --target ${{ matrix.target }}
          cp /tmp/pick/target/${{ matrix.target }}/release/pentest-agent dist/

      - name: Checkout and build ks-connector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/kubestudio.git /tmp/kubestudio
          git -C /tmp/kubestudio checkout ${{ env.KUBESTUDIO_REF }}
          cargo build --release --manifest-path /tmp/kubestudio/Cargo.toml --bin ks-connector --features connector --target ${{ matrix.target }}
          cp /tmp/kubestudio/target/${{ matrix.target }}/release/ks-connector dist/

      - name: Import Apple certificate
        if: inputs.macos_signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Make build script executable
        run: chmod +x scripts/build-dmg.sh

      - name: Build DMG
        env:
          APPLE_TEAM_ID: ${{ inputs.macos_signing && secrets.APPLE_TEAM_ID || '' }}
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          VERSION="${TAG_VERSION#v}"
          # ref_name may be a branch on workflow_dispatch (e.g. feat/easy-mode);
          # a '/' breaks the .dmg filename and the Info.plist version fields.
          VERSION="${VERSION//\//-}"
          ./scripts/build-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Notarize DMG
        if: inputs.macos_signing
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_FILE=$(ls StrikeHub-*.dmg)

          # Submit once and capture the submission ID
          SUBMIT_OUT=$(xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json)
          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Submission ID: $SUBMISSION_ID"

          # Poll the same submission — don't re-upload on timeout
          for attempt in 1 2 3; do
            echo "Waiting for notarization (attempt $attempt/3, 30m timeout)..."
            if xcrun notarytool wait "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --timeout 30m; then

              STATUS=$(xcrun notarytool info "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --output-format json | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")

              if [ "$STATUS" = "Accepted" ]; then
                echo "Notarization succeeded."
                break
              else
                echo "Notarization finished with status: $STATUS"
                xcrun notarytool log "$SUBMISSION_ID" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
                exit 1
              fi
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Notarization still in progress after 3 wait cycles (90m total)."
              exit 1
            fi
            echo "Timeout reached, continuing to wait..."
          done

          xcrun stapler staple "$DMG_FILE"

      - name: Verify DMG
        run: |
          hdiutil verify StrikeHub-*.dmg
          hdiutil attach StrikeHub-*.dmg -mountpoint /tmp/dmg-verify
          echo "=== App bundle contents ==="
          ls -la /tmp/dmg-verify/StrikeHub.app/Contents/MacOS/
          test -x /tmp/dmg-verify/StrikeHub.app/Contents/MacOS/strikehub-bin
          test -f /tmp/dmg-verify/StrikeHub.app/Contents/Info.plist
          codesign --verify /tmp/dmg-verify/StrikeHub.app
          grep -q "studio.strike48.com" /tmp/dmg-verify/StrikeHub.app/Contents/MacOS/strikehub
          hdiutil detach /tmp/dmg-verify

      - name: Generate checksum
        run: |
          shasum -a 256 StrikeHub-*.dmg > strikehub-darwin-${{ matrix.arch }}.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: strikehub-dmg-${{ matrix.arch }}
          path: |
            StrikeHub-*.dmg
            *.dmg.sha256

  release:
    name: Release
    if: github.repository_owner == 'Strike48-public'
    needs: [build, docker, installers, dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: strikehub-*
          merge-multiple: false

      - name: Prepare assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Resolve image tag
        id: imagetag
        run: |
          # The docker job tags the ghcr image via docker/metadata-action
          # type=semver,pattern={{version}}, i.e. the tag's semver with the
          # leading v stripped (tag v0.1.22 -> image tags 0.1.22, 0.1, and
          # the bare sha). Derive it the same way here so the documented
          # pull/install commands match what the docker job actually pushed.
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## StrikeHub ${{ github.ref_name }}

            ### Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | macOS DMG | Apple Silicon | `StrikeHub-*-aarch64.dmg` |
            | macOS DMG | Intel | `StrikeHub-*-x86_64.dmg` |
            | macOS | Apple Silicon | `strikehub-darwin-aarch64.tar.gz` |
            | macOS | Intel | `strikehub-darwin-x86_64.tar.gz` |
            | Linux AppImage | x86_64 | `StrikeHub-*-x86_64.AppImage` |
            | Linux AppImage | aarch64 | `StrikeHub-*-aarch64.AppImage` |
            | Windows MSI | x86_64 | `strikehub-windows-x86_64.msi` |
            | Windows MSI | arm64 | `strikehub-windows-arm64.msi` |

            All packages include bundled connectors (`ks-connector` and `pentest-agent`) and pre-configured environment variables.
            - **`.msi`** — Windows installer with Start Menu, desktop shortcut, and system env vars
            - **`.AppImage`** — Portable Linux package: runs out of the box on stock Ubuntu 24.04/26.04, including minimal/server images (zero extra packages — the GTK/WebKit runtime + wayland/gbm/EGL load-time deps are bundled; no GL stack needed, rendering uses the non-compositing software path). Building from source instead? Install `libegl1 libgbm1 libwayland-client0 ca-certificates libwebkit2gtk-4.1-0` first (desktop)

            <!--
            Docker instructions hidden from the rendered release until the published
            image path works end-to-end (private ghcr package, never QA'd as a customer
            path) — see issue #105. Retained verbatim for one-line re-enable:

              docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.imagetag.outputs.tag }}
            -->

            ### Helm

            ```bash
            helm install strikehub chart/strikehub \
              --set image.tag=${{ steps.imagetag.outputs.tag }}
            ```

            ### Checksums

            See individual `.sha256` files for checksums.

