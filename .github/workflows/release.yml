name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no publish)'
        required: true
        default: true
        type: boolean
      # TEMPORARY: macOS signing disabled by default during Apple developer account suspension.
      # TODO: Change default back to true once account is restored.
      macos_signing:
        description: 'Enable macOS code signing & notarization (default: false due to account suspension)'
        required: true
        default: false
        type: boolean

# Only run in the origin repo, never on forks
run-name: "Release ${{ github.ref_name }} (org-only)"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Ship the bundled pentest-agent easy-mode-first. Read at BUILD time via
  # option_env! in pick's config.rs, so it must be present when the connector
  # compiles (applies to every job/step). NOTE: strikehub's own easy-mode default
  # is NOT set here — build.rs bakes it from build-defaults.toml ([easy_mode]
  # default), which overrides any ambient env, so a var here would be dead.
  PICK_EASY_MODE: "true"

# Versioning: Cargo.toml is bumped in the same PR that ships the change.
# Each job below re-stamps Cargo.toml from the tag at build time, so
# shipped artifacts always carry the tag's version regardless of what
# main currently reads.
jobs:
  docker:
    name: Docker Image
    if: github.repository_owner == 'Strike48-public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Cargo.toml to tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TARGET="${GITHUB_REF_NAME#v}"
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CURRENT" != "$TARGET" ]; then
            sed -i.bak "s/^version = \".*\"/version = \"$TARGET\"/" Cargo.toml
            rm Cargo.toml.bak
            echo "Bumped Cargo.toml: $CURRENT -> $TARGET"
          else
            echo "Cargo.toml already at $TARGET"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: Build ${{ matrix.target }}
    if: github.repository_owner == 'Strike48-public'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: strikehub-darwin-x86_64
            binary_name: strikehub
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: strikehub-darwin-aarch64
            binary_name: strikehub

    steps:
      - uses: actions/checkout@v4

      - name: Sync Cargo.toml to tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TARGET="${GITHUB_REF_NAME#v}"
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CURRENT" != "$TARGET" ]; then
            sed -i.bak "s/^version = \".*\"/version = \"$TARGET\"/" Cargo.toml
            rm Cargo.toml.bak
            echo "Bumped Cargo.toml: $CURRENT -> $TARGET"
          else
            echo "Cargo.toml already at $TARGET"
          fi

      - name: Load connector refs
        run: cat connector-versions.env >> "$GITHUB_ENV"

      - name: Resolve bundled connector timestamps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bake each pinned connector's git commit timestamp (ISO-8601 UTC) into
          # the strikehub binary so the runtime "newest wins" resolver knows what
          # this install shipped. Uses the GitHub API (no full clone needed here;
          # the connectors are cloned+built in later steps).
          # Resolve a ref's commit date (ISO-8601 …Z). Best-effort: a failed
          # lookup prints nothing and returns 0, so the step never aborts under
          # `set -e -o pipefail` (a missing ts just bakes epoch-0 → that connector
          # won't seed, which is safe). Try the branches endpoint FIRST because it
          # handles slash-containing branch names (e.g. josh/catching-up) that the
          # commits/<ref> path misinterprets; fall back to commits/ for tags/SHAs.
          resolve_ts () {
            local repo="$1" ref="$2" ts=""
            # Branch first (handles slashed branch names), then tag/SHA via commits.
            # A 404 body is non-empty, so a naive `-z` check would skip the fallback
            # and bake the error JSON as the timestamp. Gate on the ISO-8601 date
            # shape: fall through to commits/ if branches/ didn't return a date, and
            # empty out anything that still isn't a date (-> epoch-0, seed no-ops).
            ts="$(gh api "repos/$repo/branches/$ref" --jq '.commit.commit.committer.date' 2>/dev/null)" || ts=""
            case "$ts" in ????-??-??T??:??:??Z) ;; *)
              ts="$(gh api "repos/$repo/commits/$ref" --jq '.commit.committer.date' 2>/dev/null)" || ts="" ;;
            esac
            case "$ts" in ????-??-??T??:??:??Z) ;; *) ts="" ;; esac
            printf '%s' "$ts"
          }
          PICK_TS="$(resolve_ts Strike48-public/pick "$PICK_REF")"
          KS_TS="$(resolve_ts Strike48-public/kubestudio "$KUBESTUDIO_REF")"
          echo "STRIKEHUB_BUNDLED_PICK_REF=$PICK_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_PICK_TS=$PICK_TS" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_REF=$KUBESTUDIO_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_TS=$KS_TS" >> "$GITHUB_ENV"
          echo "Bundled: pick=$PICK_REF@$PICK_TS  kubestudio=$KUBESTUDIO_REF@$KS_TS"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install protobuf
        run: brew install protobuf

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features desktop

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.binary_name }}

      # Build connectors from source at pinned git refs
      - name: Checkout and build pentest-agent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/pick.git /tmp/pick
          git -C /tmp/pick checkout ${{ env.PICK_REF }}
          cargo build --release --manifest-path /tmp/pick/Cargo.toml --bin pentest-agent --target ${{ matrix.target }}
          cp /tmp/pick/target/${{ matrix.target }}/release/pentest-agent dist/

      - name: Checkout and build ks-connector
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/kubestudio.git /tmp/kubestudio
          git -C /tmp/kubestudio checkout ${{ env.KUBESTUDIO_REF }}
          cargo build --release --manifest-path /tmp/kubestudio/Cargo.toml --bin ks-connector --features connector --target ${{ matrix.target }}
          cp /tmp/kubestudio/target/${{ matrix.target }}/release/ks-connector dist/

      - name: Import Apple certificate
        if: inputs.macos_signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Sign macOS binaries
        if: inputs.macos_signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for bin in dist/*; do
            codesign --force --options runtime \
              --entitlements entitlements.plist \
              --sign "Developer ID Application: Devo Inc. ($APPLE_TEAM_ID)" \
              "$bin"
          done

      - name: Notarize strikehub binary
        if: inputs.macos_signing
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only notarize strikehub — connectors are notarized by their own repos
          ditto -c -k --keepParent dist/${{ matrix.binary_name }} $RUNNER_TEMP/strikehub.zip

          SUBMIT_OUT=$(xcrun notarytool submit $RUNNER_TEMP/strikehub.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json)
          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Submission ID: $SUBMISSION_ID"

          for attempt in 1 2 3; do
            echo "Waiting for notarization (attempt $attempt/3, 30m timeout)..."
            if xcrun notarytool wait "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --timeout 30m; then

              STATUS=$(xcrun notarytool info "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --output-format json | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")

              if [ "$STATUS" = "Accepted" ]; then
                echo "Notarization succeeded."
                break
              else
                echo "Notarization finished with status: $STATUS"
                xcrun notarytool log "$SUBMISSION_ID" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
                exit 1
              fi
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Notarization still in progress after 3 wait cycles (90m total)."
              exit 1
            fi
            echo "Timeout reached, continuing to wait..."
          done

      - name: Package archive
        shell: bash
        working-directory: dist
        run: |
          tar -czvf ${{ matrix.artifact }}.tar.gz *
          # Keep only the archive for upload
          find . -maxdepth 1 ! -name '*.tar.gz' ! -name '*.sha256' -type f -delete

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: shasum -a 256 * > ${{ matrix.artifact }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  installers:
    name: Build ${{ matrix.name }}
    if: github.repository_owner == 'Strike48-public'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: AppImage x86_64
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            artifact: strikehub-appimage-x86_64
            installer: appimage
            binary_name: strikehub
          - os: ubuntu-24.04-arm
            name: AppImage aarch64
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            artifact: strikehub-appimage-aarch64
            installer: appimage
            binary_name: strikehub
          - os: windows-latest
            name: MSI x86_64
            target: x86_64-pc-windows-msvc
            arch: x86_64
            artifact: strikehub-windows-x86_64
            installer: msi
            binary_name: strikehub.exe

    steps:
      - uses: actions/checkout@v4

      - name: Sync Cargo.toml to tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TARGET="${GITHUB_REF_NAME#v}"
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CURRENT" != "$TARGET" ]; then
            sed -i.bak "s/^version = \".*\"/version = \"$TARGET\"/" Cargo.toml
            rm Cargo.toml.bak
            echo "Bumped Cargo.toml: $CURRENT -> $TARGET"
          else
            echo "Cargo.toml already at $TARGET"
          fi

      - name: Load connector refs
        shell: bash
        run: cat connector-versions.env >> "$GITHUB_ENV"

      - name: Resolve bundled connector timestamps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bake each pinned connector's git commit timestamp (ISO-8601 UTC) into
          # the strikehub binary so the runtime "newest wins" resolver knows what
          # this install shipped. Uses the GitHub API (no full clone needed here;
          # the connectors are cloned+built in later steps).
          # Resolve a ref's commit date (ISO-8601 …Z). Best-effort: a failed
          # lookup prints nothing and returns 0, so the step never aborts under
          # `set -e -o pipefail` (a missing ts just bakes epoch-0 → that connector
          # won't seed, which is safe). Try the branches endpoint FIRST because it
          # handles slash-containing branch names (e.g. josh/catching-up) that the
          # commits/<ref> path misinterprets; fall back to commits/ for tags/SHAs.
          resolve_ts () {
            local repo="$1" ref="$2" ts=""
            # Branch first (handles slashed branch names), then tag/SHA via commits.
            # A 404 body is non-empty, so a naive `-z` check would skip the fallback
            # and bake the error JSON as the timestamp. Gate on the ISO-8601 date
            # shape: fall through to commits/ if branches/ didn't return a date, and
            # empty out anything that still isn't a date (-> epoch-0, seed no-ops).
            ts="$(gh api "repos/$repo/branches/$ref" --jq '.commit.commit.committer.date' 2>/dev/null)" || ts=""
            case "$ts" in ????-??-??T??:??:??Z) ;; *)
              ts="$(gh api "repos/$repo/commits/$ref" --jq '.commit.committer.date' 2>/dev/null)" || ts="" ;;
            esac
            case "$ts" in ????-??-??T??:??:??Z) ;; *) ts="" ;; esac
            printf '%s' "$ts"
          }
          PICK_TS="$(resolve_ts Strike48-public/pick "$PICK_REF")"
          KS_TS="$(resolve_ts Strike48-public/kubestudio "$KUBESTUDIO_REF")"
          echo "STRIKEHUB_BUNDLED_PICK_REF=$PICK_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_PICK_TS=$PICK_TS" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_REF=$KUBESTUDIO_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_TS=$KS_TS" >> "$GITHUB_ENV"
          echo "Bundled: pick=$PICK_REF@$PICK_TS  kubestudio=$KUBESTUDIO_REF@$KS_TS"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libpcap-dev \
            file \
            wget \
            imagemagick \
            librsvg2-bin \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.installer }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features desktop

      - name: Prepare dist directory
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.binary_name }}

      # Build connectors from source at pinned git refs
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Checkout and build pentest-agent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/pick.git /tmp/pick
          git -C /tmp/pick checkout ${{ env.PICK_REF }}
          cargo build --release --manifest-path /tmp/pick/Cargo.toml --bin pentest-agent --target ${{ matrix.target }}
          cp /tmp/pick/target/${{ matrix.target }}/release/pentest-agent${{ runner.os == 'Windows' && '.exe' || '' }} dist/

      - name: Checkout and build ks-connector
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/kubestudio.git /tmp/kubestudio
          git -C /tmp/kubestudio checkout ${{ env.KUBESTUDIO_REF }}
          cargo build --release --manifest-path /tmp/kubestudio/Cargo.toml --bin ks-connector --features connector --target ${{ matrix.target }}
          cp /tmp/kubestudio/target/${{ matrix.target }}/release/ks-connector${{ runner.os == 'Windows' && '.exe' || '' }} dist/

      # ── AppImage steps ──
      - name: Build AppImage
        if: matrix.installer == 'appimage'
        run: |
          chmod +x scripts/build-appimage.sh
          TAG_VERSION="${{ github.ref_name }}"
          VERSION="${TAG_VERSION#v}"
          # ref_name may be a branch on workflow_dispatch (e.g. feat/easy-mode);
          # a '/' in the version breaks the output filename (mksquashfs can't
          # create a path with a missing dir). Sanitize to a flat token.
          VERSION="${VERSION//\//-}"
          ./scripts/build-appimage.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify AppImage bundles GTK/WebKit runtime
        if: matrix.installer == 'appimage'
        run: |
          set -euo pipefail
          AI=$(ls StrikeHub-*.AppImage | head -1)
          chmod +x "$AI"
          # Assert the runtime is bundled — if these libs aren't inside, the
          # AppImage relies on the host and isn't portable (the bug we fixed).
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./"$AI" --appimage-extract >/dev/null
          MISSING=0
          for lib in libwebkit2gtk-4.1.so.0 libgtk-3.so.0 libxdo.so.3; do
            find squashfs-root -name "$lib*" | grep -q . || { echo "MISSING bundled lib: $lib"; MISSING=1; }
          done
          find squashfs-root -name 'WebKitNetworkProcess' | grep -q . || { echo "MISSING WebKitNetworkProcess helper"; MISSING=1; }
          # The hardcoded absolute WebKit exec path must be patched out, else the
          # web process can't spawn on a host without webkit at that fixed path.
          LIBWK=$(find squashfs-root -name 'libwebkit2gtk-4.1.so.0' -type f | head -1)
          python3 -c "import re,sys; d=open('$LIBWK','rb').read(); sys.exit(1 if re.search(rb'/usr/lib/[a-z0-9_]+-linux-gnu/webkit2gtk-4\.1\x00', d) else 0)" \
            && echo "webkit exec path patched to relative ✓" \
            || { echo "MISSING: libwebkit still has an absolute webkit2gtk-4.1 exec path (patch failed)"; MISSING=1; }
          for c in pentest-agent ks-connector; do
            find squashfs-root/usr/bin -maxdepth 1 -name "$c" | grep -q . || { echo "MISSING connector sibling: usr/bin/$c"; MISSING=1; }
          done
          rm -rf squashfs-root
          [ "$MISSING" -eq 0 ] || { echo "AppImage is NOT portable — runtime not bundled."; exit 1; }
          echo "AppImage bundles the GTK/WebKit runtime + keeps connector siblings ✓"

      - name: Generate checksum (AppImage)
        if: matrix.installer == 'appimage'
        run: sha256sum StrikeHub-*.AppImage > ${{ matrix.artifact }}.AppImage.sha256

      - uses: actions/upload-artifact@v4
        if: matrix.installer == 'appimage'
        with:
          name: ${{ matrix.artifact }}
          path: |
            StrikeHub-*.AppImage
            *.AppImage.sha256

      # ── MSI steps ──
      - name: Sign Windows binaries
        if: matrix.installer == 'msi'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build Windows MSI
        if: matrix.installer == 'msi'
        shell: pwsh
        run: |
          # WiX Product/@Version must be numeric x.x.x.x, so it can't be a branch
          # name (workflow_dispatch sets ref_name to e.g. feat/easy-mode). Always
          # build the MSI with the numeric Cargo.toml version; the artifact is
          # renamed to the static name below regardless, so the branch label isn't
          # needed in the filename.
          $Version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          Write-Host "MSI ProductVersion: $Version"
          .\scripts\build-msi.ps1 -Version $Version -Arch ${{ matrix.arch }}
          Move-Item "StrikeHub-$Version-${{ matrix.arch }}.msi" "dist\${{ matrix.artifact }}.msi"

      - name: Sign MSI
        if: matrix.installer == 'msi'
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Clean dist for MSI
        if: matrix.installer == 'msi'
        shell: bash
        working-directory: dist
        run: find . -maxdepth 1 ! -name '*.msi' ! -name '*.sha256' -type f -delete

      - name: Generate checksum (MSI)
        if: matrix.installer == 'msi'
        shell: bash
        working-directory: dist
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum * > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 * > ${{ matrix.artifact }}.sha256
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.installer == 'msi'
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  dmg:
    name: Build DMG (${{ matrix.arch }})
    if: github.repository_owner == 'Strike48-public'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
            connector_suffix: darwin-x86_64
          - os: macos-15
            arch: aarch64
            target: aarch64-apple-darwin
            connector_suffix: darwin-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Sync Cargo.toml to tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TARGET="${GITHUB_REF_NAME#v}"
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$CURRENT" != "$TARGET" ]; then
            sed -i.bak "s/^version = \".*\"/version = \"$TARGET\"/" Cargo.toml
            rm Cargo.toml.bak
            echo "Bumped Cargo.toml: $CURRENT -> $TARGET"
          else
            echo "Cargo.toml already at $TARGET"
          fi

      - name: Load connector refs
        run: cat connector-versions.env >> "$GITHUB_ENV"

      - name: Resolve bundled connector timestamps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bake each pinned connector's git commit timestamp (ISO-8601 UTC) into
          # the strikehub binary so the runtime "newest wins" resolver knows what
          # this install shipped. Uses the GitHub API (no full clone needed here;
          # the connectors are cloned+built in later steps).
          # Resolve a ref's commit date (ISO-8601 …Z). Best-effort: a failed
          # lookup prints nothing and returns 0, so the step never aborts under
          # `set -e -o pipefail` (a missing ts just bakes epoch-0 → that connector
          # won't seed, which is safe). Try the branches endpoint FIRST because it
          # handles slash-containing branch names (e.g. josh/catching-up) that the
          # commits/<ref> path misinterprets; fall back to commits/ for tags/SHAs.
          resolve_ts () {
            local repo="$1" ref="$2" ts=""
            # Branch first (handles slashed branch names), then tag/SHA via commits.
            # A 404 body is non-empty, so a naive `-z` check would skip the fallback
            # and bake the error JSON as the timestamp. Gate on the ISO-8601 date
            # shape: fall through to commits/ if branches/ didn't return a date, and
            # empty out anything that still isn't a date (-> epoch-0, seed no-ops).
            ts="$(gh api "repos/$repo/branches/$ref" --jq '.commit.commit.committer.date' 2>/dev/null)" || ts=""
            case "$ts" in ????-??-??T??:??:??Z) ;; *)
              ts="$(gh api "repos/$repo/commits/$ref" --jq '.commit.committer.date' 2>/dev/null)" || ts="" ;;
            esac
            case "$ts" in ????-??-??T??:??:??Z) ;; *) ts="" ;; esac
            printf '%s' "$ts"
          }
          PICK_TS="$(resolve_ts Strike48-public/pick "$PICK_REF")"
          KS_TS="$(resolve_ts Strike48-public/kubestudio "$KUBESTUDIO_REF")"
          echo "STRIKEHUB_BUNDLED_PICK_REF=$PICK_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_PICK_TS=$PICK_TS" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_REF=$KUBESTUDIO_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_TS=$KS_TS" >> "$GITHUB_ENV"
          echo "Bundled: pick=$PICK_REF@$PICK_TS  kubestudio=$KUBESTUDIO_REF@$KS_TS"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-dmg

      - name: Install rsvg-convert and protobuf
        run: brew install librsvg protobuf

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features desktop

      - name: Prepare dist directory
        run: mkdir -p dist

      # Build connectors from source at pinned git refs
      - name: Checkout and build pentest-agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/pick.git /tmp/pick
          git -C /tmp/pick checkout ${{ env.PICK_REF }}
          cargo build --release --manifest-path /tmp/pick/Cargo.toml --bin pentest-agent --target ${{ matrix.target }}
          cp /tmp/pick/target/${{ matrix.target }}/release/pentest-agent dist/

      - name: Checkout and build ks-connector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/Strike48-public/kubestudio.git /tmp/kubestudio
          git -C /tmp/kubestudio checkout ${{ env.KUBESTUDIO_REF }}
          cargo build --release --manifest-path /tmp/kubestudio/Cargo.toml --bin ks-connector --features connector --target ${{ matrix.target }}
          cp /tmp/kubestudio/target/${{ matrix.target }}/release/ks-connector dist/

      - name: Import Apple certificate
        if: inputs.macos_signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Make build script executable
        run: chmod +x scripts/build-dmg.sh

      - name: Build DMG
        env:
          APPLE_TEAM_ID: ${{ inputs.macos_signing && secrets.APPLE_TEAM_ID || '' }}
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          VERSION="${TAG_VERSION#v}"
          # ref_name may be a branch on workflow_dispatch (e.g. feat/easy-mode);
          # a '/' breaks the .dmg filename and the Info.plist version fields.
          VERSION="${VERSION//\//-}"
          ./scripts/build-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Notarize DMG
        if: inputs.macos_signing
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_FILE=$(ls StrikeHub-*.dmg)

          # Submit once and capture the submission ID
          SUBMIT_OUT=$(xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json)
          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Submission ID: $SUBMISSION_ID"

          # Poll the same submission — don't re-upload on timeout
          for attempt in 1 2 3; do
            echo "Waiting for notarization (attempt $attempt/3, 30m timeout)..."
            if xcrun notarytool wait "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --timeout 30m; then

              STATUS=$(xcrun notarytool info "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --output-format json | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")

              if [ "$STATUS" = "Accepted" ]; then
                echo "Notarization succeeded."
                break
              else
                echo "Notarization finished with status: $STATUS"
                xcrun notarytool log "$SUBMISSION_ID" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
                exit 1
              fi
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Notarization still in progress after 3 wait cycles (90m total)."
              exit 1
            fi
            echo "Timeout reached, continuing to wait..."
          done

          xcrun stapler staple "$DMG_FILE"

      - name: Verify DMG
        run: |
          hdiutil verify StrikeHub-*.dmg
          hdiutil attach StrikeHub-*.dmg -mountpoint /tmp/dmg-verify
          echo "=== App bundle contents ==="
          ls -la /tmp/dmg-verify/StrikeHub.app/Contents/MacOS/
          test -x /tmp/dmg-verify/StrikeHub.app/Contents/MacOS/strikehub-bin
          test -f /tmp/dmg-verify/StrikeHub.app/Contents/Info.plist
          codesign --verify /tmp/dmg-verify/StrikeHub.app
          grep -q "studio.strike48.com" /tmp/dmg-verify/StrikeHub.app/Contents/MacOS/strikehub
          hdiutil detach /tmp/dmg-verify

      - name: Generate checksum
        run: |
          shasum -a 256 StrikeHub-*.dmg > strikehub-darwin-${{ matrix.arch }}.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: strikehub-dmg-${{ matrix.arch }}
          path: |
            StrikeHub-*.dmg
            *.dmg.sha256

  release:
    name: Release
    if: github.repository_owner == 'Strike48-public'
    needs: [build, docker, installers, dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: strikehub-*
          merge-multiple: false

      - name: Prepare assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## StrikeHub ${{ github.ref_name }}

            ### Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | macOS DMG | Apple Silicon | `StrikeHub-*-aarch64.dmg` |
            | macOS DMG | Intel | `StrikeHub-*-x86_64.dmg` |
            | macOS | Apple Silicon | `strikehub-darwin-aarch64.tar.gz` |
            | macOS | Intel | `strikehub-darwin-x86_64.tar.gz` |
            | Linux AppImage | x86_64 | `StrikeHub-*-x86_64.AppImage` |
            | Linux AppImage | aarch64 | `StrikeHub-*-aarch64.AppImage` |
            | Windows MSI | x86_64 | `strikehub-windows-x86_64.msi` |

            All packages include bundled connectors (`ks-connector` and `pentest-agent`) and pre-configured environment variables.
            - **`.msi`** — Windows installer with Start Menu, desktop shortcut, and system env vars
            - **`.AppImage`** — Portable Linux package, runs on most distributions without installation

            ### Docker

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_name }}
            ```

            ### Helm

            ```bash
            helm install strikehub chart/strikehub \
              --set image.tag=${{ github.ref_name }}
            ```

            ### Checksums

            See individual `.sha256` files for checksums.

