name: PII Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Self-test the scanner itself. Needs no secret, so it always runs and guards
  # the fixed-string / fail-loud behavior (esp. names with regex metacharacters).
  self-test:
    name: Scanner self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scanner regression tests
        run: bash scripts/test-check-pii.sh

  check-pii:
    name: Scan for customer names
    runs-on: ubuntu-latest
    # Fork PRs: GitHub withholds repository secrets from pull_request runs
    # triggered by a fork, so on a fork PR PII_NAMES is always empty and the
    # fail-loud guard below (and the scanner's own empty-list check) can never
    # pass - the check would go red on every fork PR no matter what it scans.
    # Skip this whole job for fork PRs (the pii-scan-fork-notice job explains
    # why) and keep it fully active, guard included, for runs from this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # The banned-name list is injected from a repository secret so the customer
    # names never live in this public repo. Configure it under Settings ->
    # Secrets and variables -> Actions -> PII_NAMES (newline- or comma-separated).
    env:
      PII_NAMES: ${{ secrets.PII_NAMES }}
      # Redact matched content: on a hit the scanner prints only the location,
      # never the name, so a customer name never lands in this public CI log.
      PII_REDACT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure scanner is executable
        run: chmod +x scripts/check-pii.sh

      - name: Verify PII name list is configured
        run: |
          if [[ -z "${PII_NAMES:-}" ]]; then
            echo "::error::PII_NAMES secret is not set - the scanner cannot run."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Scanning PR title..."
          printf '%s\n' "$PR_TITLE" | scripts/check-pii.sh

      - name: Check PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Scanning PR body..."
          printf '%s\n' "${PR_BODY:-<empty>}" | scripts/check-pii.sh

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Scanning commit messages between $BASE_SHA..$HEAD_SHA"
          git log --format='%H%n%s%n%b%n---' "$BASE_SHA..$HEAD_SHA" | scripts/check-pii.sh

      - name: Check changed file contents
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Scanning diff for added lines between $BASE_SHA..$HEAD_SHA"
          # Only scan added lines (lines starting with '+' but not '+++') to avoid
          # tripping on unchanged historical content or on removal of bad content.
          # `|| true` keeps a deletion-only diff (grep finds nothing, exits 1)
          # from failing the step under the runner's `pipefail` shell.
          added="$(
            git diff "$BASE_SHA..$HEAD_SHA" -- . ':!scripts/check-pii.sh' ':!.github/workflows/pii-check.yml' \
              | grep -E '^\+[^+]' || true
          )"
          printf '%s\n' "$added" | scripts/check-pii.sh

  # Notice-only companion to check-pii for fork PRs, where the job above is
  # skipped because the PII_NAMES secret is withheld. It surfaces a clear
  # reason in the check list instead of leaving the scan silently absent.
  pii-scan-fork-notice:
    name: PII scan skipped (fork PR)
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Explain why the PII scan is skipped
        run: echo "::notice::PII scan skipped — fork PR, secret unavailable"
