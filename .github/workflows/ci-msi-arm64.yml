name: "ci: MSI arm64 (packaging gate)"

# Path-scoped gate for the arm64 MSI PACKAGING path (CRT staging, connector
# layout, WiX, upgrade rules) — the path that exists only in the Release
# workflow and so could not fail on any PR before this file: a dead CRT
# source URL survived every PR and 404'd on the first real release run
# (build-msi.ps1:168, dry run 42905776882). Running the leg on every PR
# costs ~7 min (measured; 5.4 of it is the aarch64 release build) on top of
# the ~3 min suite, so it filters on the file set that can introduce the bug
# class. Unsigned — Azure Trusted Signing stays release-only.
on:
  pull_request:
    paths:
      - ".github/workflows/ci-msi-arm64.yml"
      - ".github/workflows/release.yml"
      - "scripts/build-msi.ps1"
      - "scripts/verify-crt-coverage.ps1"
      - "wix/**"
      - "connector-versions.env"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-msi-arm64.yml"
      - ".github/workflows/release.yml"
      - "scripts/build-msi.ps1"
      - "scripts/verify-crt-coverage.ps1"
      - "wix/**"
      - "connector-versions.env"

permissions:
  contents: read

jobs:
  build-msi-arm64:
    name: Build MSI arm64 (unsigned, packaging gate)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Load connector refs
        shell: bash
        run: cat connector-versions.env >> "$GITHUB_ENV"

      - name: Resolve bundled connector timestamps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resolve_ts () {
            local repo="$1" ref="$2" ts=""
            # Branch first (handles slashed branch names), then tag/SHA via commits.
            # A 404 body is non-empty, so a naive `-z` check would skip the fallback
            # and bake the error JSON as the timestamp. Gate on the ISO-8601 date
            # shape: fall through to commits/ if branches/ didn't return a date, and
            # empty out anything that still isn't a date (-> epoch-0, seed no-ops).
            ts="$(gh api "repos/$repo/branches/$ref" --jq '.commit.commit.committer.date' 2>/dev/null)" || ts=""
            case "$ts" in ????-??-??T??:??:??Z) ;; *)
              ts="$(gh api "repos/$repo/commits/$ref" --jq '.commit.committer.date' 2>/dev/null)" || ts="" ;;
            esac
            case "$ts" in ????-??-??T??:??:??Z) ;; *) ts="" ;; esac
            printf '%s' "$ts"
          }
          PICK_TS="$(resolve_ts Strike48-public/pick "$PICK_REF")"
          KS_TS="$(resolve_ts Strike48-public/kubestudio "$KUBESTUDIO_REF")"
          echo "STRIKEHUB_BUNDLED_PICK_REF=$PICK_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_PICK_TS=$PICK_TS" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_REF=$KUBESTUDIO_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_TS=$KS_TS" >> "$GITHUB_ENV"
          echo "Bundled: pick=$PICK_REF@$PICK_TS  kubestudio=$KUBESTUDIO_REF@$KS_TS"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-pc-windows-msvc-msi-arm64

      - name: Build binary
        run: cargo build --release --target aarch64-pc-windows-msvc --no-default-features --features desktop

      # The arm64 VC++ redist (vcruntime140.dll + vcruntime140_1.dll) must come
      # from Microsoft. Probe order:
      #   1. Any VS tree (version dirs are 15/16/17/18 — NOT "20*"; the original
      #      glob could never match) for an arm64 VC14x CRT redist dir.
      #   2. Add the ARM64 C++ tools component to the found VS install via
      #      vs_installer (the image ships VS 18 + the Installer).
      #   3. Last resort: the aka.ms VC++ ARM64 redist BUNDLE — an x86 Burn
      #      launcher (PE 0x014C) that silently never starts on an ARM64 box
      #      without x86 emulation, so launch via Start-Process -PassThru and
      #      fail loudly when it cannot.
      # Every native call is EAP-guarded with captured output + exit code, and
      # staged DLLs pass a PE machine check (0xAA64) before staging.
      - name: Ensure arm64 VC++ CRT redist (windows-11-arm)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-PeMachine {
            param([string]$Path)
            $fs = [IO.File]::OpenRead($Path)
            try {
              $head = New-Object byte[] 4096
              [void]$fs.Read($head, 0, 4096)
              if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) { return -1 }
              $peOff = [BitConverter]::ToInt32($head, 0x3C)
              if ($head[$peOff] -ne 0x50 -or $head[$peOff + 1] -ne 0x45) { return -1 }
              return [int][BitConverter]::ToUInt16($head, $peOff + 4)
            } finally { $fs.Close() }
          }
          function Invoke-Native {
            param([string]$Bin, [string[]]$Argv)
            $prev = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $out = & $Bin @Argv 2>&1
            $code = $LASTEXITCODE
            $ErrorActionPreference = $prev
            return @{ Code = $code; Out = ($out | ForEach-Object { "$_" }) }
          }
          function Find-Arm64CrtDir {
            return Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\arm64\Microsoft.VC14*.CRT",
                                 "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\arm64\Microsoft.VC14*.CRT" -ErrorAction SilentlyContinue |
                   Where-Object { Test-Path (Join-Path $_.FullName "vcruntime140_1.dll") } |
                   Select-Object -First 1
          }
          # 1) already there? Export it as SHVCREDIST_DIR - do NOT just print it:
          # this image also carries the x64 VC redist, and the x64-hosted pwsh
          # process sees a FUSION-REDIRECTED System32 (vcruntime140_1.dll resolves
          # to the x64 copy, machine 0x8664 - observed live), so build-msi.ps1's
          # System32 root is untrustworthy here. The operator-override root must
          # point at the verified arm64 dir.
          function Use-CrtDir {
            param($Dir)
            $one = Join-Path $Dir.FullName "vcruntime140_1.dll"
            $m = Get-PeMachine $one
            if ($m -ne 0xAA64) {
              Write-Host "CRT dir $($Dir.FullName) is machine 0x$("{0:X4}" -f $m), not 0xAA64 - not usable" -ForegroundColor Yellow
              return
            }
            Add-Content -Path $env:GITHUB_ENV "SHVCREDIST_DIR=$($Dir.FullName)"
            Write-Host "arm64 CRT redist: $($Dir.FullName) (vcruntime140_1.dll machine 0xAA64) - exported SHVCREDIST_DIR"
            exit 0
          }
          $crt = Find-Arm64CrtDir
          if ($crt) { Use-CrtDir $crt }
          Write-Host "arm64 CRT redist not in the VS tree yet" -ForegroundColor Yellow
          # 2) add the ARM64 C++ tools component to the found VS install
          $vsRoot = Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio", "C:\Program Files\Microsoft Visual Studio" -Directory -ErrorAction SilentlyContinue |
                    Where-Object { Test-Path (Join-Path $_.FullName "VC") } |
                    Select-Object -First 1
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not $vsRoot -or -not (Test-Path $installer)) {
            Write-Host ("no VS install with a VC tree (vsRoot=$($vsRoot.FullName)) / vs_installer at $installer (present: $(Test-Path $installer))") -ForegroundColor Yellow
          } else {
            Write-Host "adding Microsoft.VisualStudio.Component.VC.Tools.ARM64 to $($vsRoot.FullName) ..."
            $r = Invoke-Native -Bin $installer -Argv @("modify", "--installPath", $vsRoot.FullName, "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64", "--quiet", "--norestart")
            if ($null -eq $r.Code) { throw "vs_installer modify did not start (no exit code). Output: " + (($r.Out | Select-Object -Last 20) -join ' | ') }
            Write-Host ("vs_installer modify exit: " + $r.Code)
            if ($r.Code -ne 0) { throw "vs_installer modify failed (exit $($r.Code)): " + (($r.Out | Select-Object -Last 20) -join ' | ') }
            $crt = Find-Arm64CrtDir
            if ($crt) { Use-CrtDir $crt }
            throw "VS component install succeeded but no arm64 VC14x CRT dir appeared under $($vsRoot.FullName)\VC\Redist"
          }
          # 3) last resort: the aka.ms redist bundle (x86 launcher)
          Write-Host "falling back to the aka.ms VC++ ARM64 redist bundle (x86 launcher — needs x86 emulation)" -ForegroundColor Yellow
          $dl = Join-Path $env:TEMP "vc_redist.arm64"
          New-Item -ItemType Directory -Path $dl -Force | Out-Null
          $exe = Join-Path $dl "vc_redist.arm64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.arm64.exe" -OutFile $exe
          $exeInfo = Get-Item $exe
          Write-Host ("vc_redist.arm64.exe: " + $exeInfo.Length + " bytes, product " + $exeInfo.VersionInfo.ProductVersion + ", PE machine 0x" + ("{0:X4}" -f (Get-PeMachine $exe)))
          $layout = Join-Path $dl "layout"
          $proc = $null
          $prev = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $launchErr = $null
          try { $proc = Start-Process -FilePath $exe -ArgumentList @("/layout", $layout, "/quiet", "/norestart") -Wait -PassThru }
          catch { $launchErr = "$_" }
          $ErrorActionPreference = $prev
          if ($launchErr -or $null -eq $proc) { throw "redist bundle could not start (x86 launcher on ARM64 without x86 emulation?): $launchErr" }
          if ($proc.ExitCode -ne 0) { throw "redist bundle /layout failed (exit $($proc.ExitCode))" }
          $msi = Get-ChildItem $layout -Recurse -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) { throw "redist layout produced no MSI. Layout: " + ((Get-ChildItem $layout -Recurse | Select-Object -ExpandProperty Name) -join ', ') }
          Write-Host "layout MSI: $($msi.FullName) ($($msi.Length) bytes)"
          $extract = Join-Path $dl "crt"
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          $r = Invoke-Native -Bin "msiexec" -Argv @("/a", "$($msi.FullName)", "/qn", "TARGETDIR=$extract")
          if ($null -eq $r.Code -or $r.Code -ne 0) { throw "msiexec /a failed (exit $($r.Code)): " + (($r.Out | Select-Object -Last 20) -join ' | ') }
          $one = Get-ChildItem $extract -Recurse -Filter vcruntime140_1.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $one) { throw "extraction produced no vcruntime140_1.dll. Extracted: " + ((Get-ChildItem $extract -Recurse | Select-Object -First 40 | ForEach-Object { $_.FullName }) -join ', ') }
          $m = Get-PeMachine $one.FullName
          if ($m -ne 0xAA64) { throw "staged vcruntime140_1.dll machine is 0x$("{0:X4}" -f $m), expected 0xAA64 (arm64)" }
          $dllDir = $one.Directory.FullName
          foreach ($req in "vcruntime140.dll", "vcruntime140_1.dll") {
            if (-not (Test-Path (Join-Path $dllDir $req))) { throw "$req missing from $dllDir" }
          }
          Add-Content -Path $env:GITHUB_ENV "SHVCREDIST_DIR=$dllDir"
          Write-Host "arm64 CRT staged (SHVCREDIST_DIR=$dllDir)"

      # The windows-11-arm image ships no WiX (the x64 image preinstalls 3.14).
      # Install from the official wixtoolset binary zip (single HTTPS download,
      # pinned release) instead of choco: the choco route sat 20+ minutes on a
      # windows-11-arm runner (source checks under throttling) and had never
      # completed on this image class before.
      - name: Install WiX Toolset v3 (windows-11-arm)
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host "WiX already on PATH"
            exit 0
          }
          $z = Join-Path $env:TEMP "wix314-binaries.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $z
          $ex = Join-Path $env:TEMP "wix314"
          Expand-Archive -Path $z -DestinationPath $ex -Force
          $candle = Get-ChildItem $ex -Recurse -Filter candle.exe | Select-Object -First 1
          if (-not $candle -or -not (Test-Path (Join-Path $candle.Directory.FullName "light.exe"))) {
            throw "candle.exe/light.exe not found in the WiX binaries zip"
          }
          $wixBin = $candle.Directory.FullName
          "PATH=$wixBin;$env:Path" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Host "WiX Toolset v3.14.1 at $wixBin"

      - name: Build MSI
        shell: pwsh
        run: .\scripts\build-msi.ps1 -Version 0.0.0 -Arch aarch64

      # Same CRT-coverage guard as the x64 leg and the Release workflow.
      - name: Verify app-local CRT coverage
        shell: pwsh
        run: .\scripts\verify-crt-coverage.ps1
