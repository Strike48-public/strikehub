name: "ci: MSI arm64 (packaging gate)"

# Path-scoped gate for the arm64 MSI PACKAGING path (CRT staging, connector
# layout, WiX, upgrade rules) — the path that exists only in the Release
# workflow and so could not fail on any PR before this file: a dead CRT
# source URL survived every PR and 404'd on the first real release run
# (build-msi.ps1:168, dry run 42905776882). Running the leg on every PR
# costs ~7 min (measured; 5.4 of it is the aarch64 release build) on top of
# the ~3 min suite, so it filters on the file set that can introduce the bug
# class. Unsigned — Azure Trusted Signing stays release-only.
on:
  pull_request:
    paths:
      - ".github/workflows/ci-msi-arm64.yml"
      - ".github/workflows/release.yml"
      - "scripts/build-msi.ps1"
      - "scripts/verify-crt-coverage.ps1"
      - "wix/**"
      - "connector-versions.env"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-msi-arm64.yml"
      - ".github/workflows/release.yml"
      - "scripts/build-msi.ps1"
      - "scripts/verify-crt-coverage.ps1"
      - "wix/**"
      - "connector-versions.env"

permissions:
  contents: read

jobs:
  build-msi-arm64:
    name: Build MSI arm64 (unsigned, packaging gate)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Load connector refs
        shell: bash
        run: cat connector-versions.env >> "$GITHUB_ENV"

      - name: Resolve bundled connector timestamps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resolve_ts () {
            local repo="$1" ref="$2" ts=""
            # Branch first (handles slashed branch names), then tag/SHA via commits.
            # A 404 body is non-empty, so a naive `-z` check would skip the fallback
            # and bake the error JSON as the timestamp. Gate on the ISO-8601 date
            # shape: fall through to commits/ if branches/ didn't return a date, and
            # empty out anything that still isn't a date (-> epoch-0, seed no-ops).
            ts="$(gh api "repos/$repo/branches/$ref" --jq '.commit.commit.committer.date' 2>/dev/null)" || ts=""
            case "$ts" in ????-??-??T??:??:??Z) ;; *)
              ts="$(gh api "repos/$repo/commits/$ref" --jq '.commit.committer.date' 2>/dev/null)" || ts="" ;;
            esac
            case "$ts" in ????-??-??T??:??:??Z) ;; *) ts="" ;; esac
            printf '%s' "$ts"
          }
          PICK_TS="$(resolve_ts Strike48-public/pick "$PICK_REF")"
          KS_TS="$(resolve_ts Strike48-public/kubestudio "$KUBESTUDIO_REF")"
          echo "STRIKEHUB_BUNDLED_PICK_REF=$PICK_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_PICK_TS=$PICK_TS" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_REF=$KUBESTUDIO_REF" >> "$GITHUB_ENV"
          echo "STRIKEHUB_BUNDLED_KUBESTUDIO_TS=$KS_TS" >> "$GITHUB_ENV"
          echo "Bundled: pick=$PICK_REF@$PICK_TS  kubestudio=$KUBESTUDIO_REF@$KS_TS"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-pc-windows-msvc-msi-arm64

      - name: Build binary
        run: cargo build --release --target aarch64-pc-windows-msvc --no-default-features --features desktop

      # The arm64 VC++ redist (vcruntime140.dll + vcruntime140_1.dll) must come
      # from Microsoft AND be read from a trustworthy process. This image has
      # proven, run by run:
      #   * VS 18's tree dir named "arm64\Microsoft.VC142.CRT" contains X64 DLLs
      #     (machine 0x8664) - directory names are not ground truth here.
      #   * The x64-hosted pwsh process sees a FUSION-REDIRECTED System32:
      #     vcruntime140.dll reads 0xAA64 (arm64, the only copy) while
      #     vcruntime140_1.dll in the SAME dir reads 0x8664 (an x64 shadow copy
      #     exists because the x64 redist is also installed).
      #   * The aka.ms vc_redist.arm64.exe is an x86 downloader bundle: /layout
      #     yields only the exe (no embedded payload MSI), but /install works.
      # Solution: all PE reads of CRT files happen in an ARM64-NATIVE process
      # (the image's toolcache Python, PE-verified 0xAA64), which sees the true
      # native System32. Probe order: VS tree (any 15/16/17/18) -> stage from
      # the native System32 view -> install the MS bundle and re-stage.
      # Staged dirs are exported as SHVCREDIST_DIR (build-msi.ps1's root #1,
      # consulted before its System32 root).
      - name: Ensure arm64 VC++ CRT redist (windows-11-arm)
        if: {IF}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-PeMachine {
            param([string]$Path)
            $fs = [IO.File]::OpenRead($Path)
            try {
              $head = New-Object byte[] 4096
              [void]$fs.Read($head, 0, 4096)
              if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) {{ return -1 }}
              $peOff = [BitConverter]::ToInt32($head, 0x3C)
              if ($head[$peOff] -ne 0x50 -or $head[$peOff + 1] -ne 0x45) {{ return -1 }}
              return [int][BitConverter]::ToUInt16($head, $peOff + 4)
            } finally {{ $fs.Close() }}
          }
          function Invoke-Native {{
            param([string]$Bin, [string[]]$Argv)
            $prev = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $out = & $Bin @Argv 2>&1
            $code = $LASTEXITCODE
            $ErrorActionPreference = $prev
            return @{{ Code = $code; Out = ($out | ForEach-Object {{ "$_" }}) }}
          }}
          # An ARM64-native interpreter: the only process class that sees the
          # true (non-fusion-redirected) System32 on this machine.
          $armPy = Get-ChildItem "C:\hostedtoolcache\windows\Python" -Directory -ErrorAction SilentlyContinue |
                   Sort-Object Name -Descending |
                   ForEach-Object {{ Join-Path $_.FullName "arm64\python.exe" }} |
                   Where-Object {{ Test-Path $_ }} |
                   Select-Object -First 1
          if (-not $armPy -or (Get-PeMachine $armPy) -ne 0xAA64) {{
            throw "no arm64-native python in C:\\hostedtoolcache\\windows\\Python (found: $armPy) - cannot read the native System32 view"
          }}
          Write-Host "arm64-native interpreter: $armPy"
          # Python helpers (run arm64-native). check <dir>: print the machine of
          # <dir>\vcruntime140_1.dll. stage <stagedir>: verify BOTH redist DLLs
          # are 0xAA64 in the native System32 view, copy them into <stagedir>,
          # and re-verify the copies.
          $pyCheck = @'
import struct, sys
def machine(p):
    with open(p, "rb") as f:
        h = f.read(4096)
    if len(h) < 4096 or h[:2] != b"MZ":
        print("NOMZ " + p); sys.exit(1)
    off = struct.unpack_from("<I", h, 0x3C)[0]
    if h[off:off + 2] != b"PE":
        print("NOPE " + p); sys.exit(1)
    return struct.unpack_from("<H", h, off + 4)[0]
mode, arg = sys.argv[1], sys.argv[2]
if mode == "check":
    m = machine(arg + "\\vcruntime140_1.dll")
    print("MACHINE 0x%X" % m); sys.exit(0 if m == 0xAA64 else 1)
if mode == "stage":
    import shutil
    for n in ("vcruntime140.dll", "vcruntime140_1.dll"):
        src = "C:\\Windows\\System32\\%s" % n
        m = machine(src)
        if m != 0xAA64:
            print("NATIVE_VIEW_FAIL %s 0x%X" % (n, m)); sys.exit(1)
        dst = arg + "\\" + n
        shutil.copyfile(src, dst)
        m2 = machine(dst)
        if m2 != 0xAA64:
            print("COPY_CHECK_FAIL %s 0x%X" % (n, m2)); sys.exit(1)
        print("STAGED %s 0xAA64" % n)
    print("NATIVE_VIEW_OK"); sys.exit(0)
'@
          $stage = Join-Path $env:TEMP "crt-stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          # 1) VS tree, any version (15/16/17/18), both PF roots - PE-verified
          #    in the arm64-native process (dir names lie on this image).
          $vsCrt = Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\arm64\Microsoft.VC14*.CRT",
                                 "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\arm64\Microsoft.VC14*.CRT" -ErrorAction SilentlyContinue |
                   Where-Object {{ Test-Path (Join-Path $_.FullName "vcruntime140_1.dll") }} |
                   Select-Object -First 1
          if ($vsCrt) {{
            $r = Invoke-Native -Bin $armPy -Argv @("check", $vsCrt.FullName)
            Write-Host ("VS tree dir " + $vsCrt.FullName + " -> " + (($r.Out | ForEach-Object {{ "$_" }}) -join ' '))
            if ($r.Code -eq 0) {{
              Add-Content -Path $env:GITHUB_ENV "SHVCREDIST_DIR=$($vsCrt.FullName)"
              Write-Host "arm64 CRT redist in VS tree (verified 0xAA64): $($vsCrt.FullName)"
              exit 0
            }}
          }}
          Write-Host "no usable arm64 CRT in the VS tree - staging from the native System32 view" -ForegroundColor Yellow
          # 2) stage both DLLs from the native System32 view (arm64 python)
          $r = Invoke-Native -Bin $armPy -Argv @("stage", $stage)
          Write-Host (($r.Out | ForEach-Object {{ "$_" }}) -join "`n")
          if ($r.Code -eq 0) {{
            Add-Content -Path $env:GITHUB_ENV "SHVCREDIST_DIR=$stage"
            Write-Host "arm64 CRT staged from native System32: $stage"
            exit 0
          }}
          # 3) the ARM64 redist is not fully installed: install the official MS
          #    bundle (x86 launcher - Start-Process, it does run on this image)
          #    and re-stage.
          Write-Host "installing the official VC++ ARM64 redist bundle (aka.ms) and re-staging" -ForegroundColor Yellow
          $dl = Join-Path $env:TEMP "vc_redist.arm64"
          New-Item -ItemType Directory -Path $dl -Force | Out-Null
          $exe = Join-Path $dl "vc_redist.arm64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.arm64.exe" -OutFile $exe
          $exeInfo = Get-Item $exe
          Write-Host ("vc_redist.arm64.exe: " + $exeInfo.Length + " bytes, product " + $exeInfo.VersionInfo.ProductVersion + ", PE machine 0x" + ("{0:X4}" -f (Get-PeMachine $exe)))
          $launchErr = $null
          $proc = $null
          $prev = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          try {{ $proc = Start-Process -FilePath $exe -ArgumentList @("/install", "/quiet", "/norestart") -Wait -PassThru }}
          catch {{ $launchErr = "$_" }}
          $ErrorActionPreference = $prev
          if ($launchErr -or $null -eq $proc) {{ throw "redist bundle could not start: $launchErr" }}
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {{ throw "redist bundle /install failed (exit $($proc.ExitCode))" }}
          $r = Invoke-Native -Bin $armPy -Argv @("stage", $stage)
          Write-Host (($r.Out | ForEach-Object {{ "$_" }}) -join "`n")
          if ($r.Code -ne 0) {{ throw "arm64 CRT still missing from the native System32 view after bundle install" }}
          Add-Content -Path $env:GITHUB_ENV "SHVCREDIST_DIR=$stage"
          Write-Host "arm64 CRT staged after bundle install: $stage"

      # The windows-11-arm image ships no WiX (the x64 image preinstalls 3.14).
      # Install from the official wixtoolset binary zip (single HTTPS download,
      # pinned release) instead of choco: the choco route sat 20+ minutes on a
      # windows-11-arm runner (source checks under throttling) and had never
      # completed on this image class before.
      - name: Install WiX Toolset v3 (windows-11-arm)
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host "WiX already on PATH"
            exit 0
          }
          $z = Join-Path $env:TEMP "wix314-binaries.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $z
          $ex = Join-Path $env:TEMP "wix314"
          Expand-Archive -Path $z -DestinationPath $ex -Force
          $candle = Get-ChildItem $ex -Recurse -Filter candle.exe | Select-Object -First 1
          if (-not $candle -or -not (Test-Path (Join-Path $candle.Directory.FullName "light.exe"))) {
            throw "candle.exe/light.exe not found in the WiX binaries zip"
          }
          $wixBin = $candle.Directory.FullName
          "PATH=$wixBin;$env:Path" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Host "WiX Toolset v3.14.1 at $wixBin"

      - name: Build MSI
        shell: pwsh
        run: .\scripts\build-msi.ps1 -Version 0.0.0 -Arch aarch64

      # Same CRT-coverage guard as the x64 leg and the Release workflow.
      - name: Verify app-local CRT coverage
        shell: pwsh
        run: .\scripts\verify-crt-coverage.ps1
